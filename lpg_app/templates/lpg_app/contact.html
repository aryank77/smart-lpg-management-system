{% extends 'lpg_app/base.html' %}
{% block content %}

<div class="container mt-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold">📞 Contact Us</h1>
        <p class="text-muted">We are here to help you anytime</p>
    </div>

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg border-0">

                <!-- Header -->
                <div class="bg-dark text-white text-center p-3 rounded-top">
                    <h5>Get in Touch</h5>
                </div>

                <div class="p-4">

                    <p><strong>📧 Email:</strong> support@lpg.com</p>
                    <p><strong>📞 Phone:</strong> +91 9876543210</p>
                    <p><strong>📍 Location:</strong> Lucknow, India</p>

                    <hr>

                    <!-- Form -->
                    <form
                        method="POST" action="">
                        {% csrf_token %}
                        <input type="text" class="form-control mb-3" placeholder="Your Name" name="name">
                        <input type="email" class="form-control mb-3" placeholder="Your Email" name="email">
                        <textarea class="form-control mb-3" rows="3" placeholder="Your Message" name="message"></textarea>
                        <input type="text" class="form-control mb-3" placeholder="Subject" name="subject">

                        <button class="btn btn-primary w-100 shadow">
                            Send Message
                        </button>
                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
