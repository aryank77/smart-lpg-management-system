{% extends 'lpg_app/base.html' %}
{% block content %}

<div class="container mt-5">

    <h2 class="text-center mb-4">🚚 Delivery Dashboard</h2>

    <table class="table">
        <tr>
            <th>Company</th>
            <th>Consumer</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        {% for b in bookings %}
        <tr>
            <td>{{ b.company.name }}</td>
            <td>{{ b.consumer_number }}</td>
            <td>{{ b.status }}</td>

            <td>
                <a href="/deliver/{{ b.id }}/" class="btn btn-success">
                    Mark Delivered
                </a>
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

{% endblock %}
